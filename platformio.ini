; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = secret.ini


; ----------------Basement--------------------------------
; Basement door lock controller.
[c3-common]
extends = secret
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
src_filter = +<main_c3_relay_controller.cpp>
build_flags =
  ${secret.build_flags}
lib_deps = 
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit BME280 Library@^2.3.0
	arduino-libraries/ArduinoBLE@^1.4.1

; Basement door lock mini-board, upload via USB.
[env:esp32-c3-relay-controller-usb]
extends = c3-common
lib_deps = adafruit/Adafruit PN532@^1.3.4

; Basement door lock mini-board remote upload via WiFi.
[env:esp32-c3-relay-controller-remote]
extends = c3-common
upload_port = 192.168.0.140
lib_deps = adafruit/Adafruit PN532@^1.3.4

; -----------------Chicken coop controller-------------------------

; This is chicken coop target.
[env:esp32-c3-chicken-coop]
src_filter = +<main_c3_chicken_coop_temp_amonia_sensor.cpp>
platform = espressif32
board = seeed_xiao_esp32c3 ; mini board
framework = arduino
build_flags =
  ${secret.build_flags}
lib_deps = 
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit BME280 Library@^2.3.0
	arduino-libraries/ArduinoBLE@^1.4.1
	adafruit/Adafruit PN532@^1.3.4

