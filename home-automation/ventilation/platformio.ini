; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[c3]
platform = platformio/espressif32
board = seeed_xiao_esp32c3
framework = arduino
build_src_filter = +<main_c3_relay_controller.cpp>
build_unflags = 
	-std=gnu++11
build_flags = 
	-std=gnu++17

[s3]
extends = c3
board = esp32-s3-devkitm-1

[env:s3-main]
extends = s3
build_src_filter = +<main.cpp>
board_build.partitions = rainmaker.csv
lib_deps = 
	PubSubClient=knolleary/PubSubClient@^2.8
	GfxLibrary=adafruit/Adafruit GFX Library
	SSD1306=adafruit/Adafruit SSD1306
	AM2320=adafruit/Adafruit AM2320 sensor library@^1.2.5
	WiFiConn=symlink://../../libraries/wifi_conn
	Utilities=symlink://../../libraries/common
	MyAM2320=symlink://../../libraries/my_am2320
	TinyYellowBlueDisplay=symlink://../../libraries/tiny_yellow_blue_display
	adafruit/Adafruit NeoPixel@^1.15.5

[env:s3-rainmaker-basic]
extends = s3
build_src_filter = +<examples/rainmaker_basic.cpp>
board_build.partitions = rainmaker.csv
lib_deps = 
	Utilities=symlink://../../libraries/common
	NeoPixed=adafruit/Adafruit NeoPixel@^1.15.5
	WiFiConn=symlink://../../libraries/wifi_conn
